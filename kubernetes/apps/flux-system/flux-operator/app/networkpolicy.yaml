---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Ingress fence for every pod in flux-system. Callers were taken from two
# days of Hubble flows (2026-11-07/09); everything else that reached these
# pods was replies to the controllers' own API, DNS and Git/OCI traffic.
# Egress is left open. Replaces the chart's flux-operator-web
# NetworkPolicy, which allowed every namespace on 8080 and 9080.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-system
spec:
  endpointSelector: {}
  ingress:
    # Kubelet probes.
    - fromEntities: ["host"]
    # Controllers fetch artifacts from source-controller (9090) and send
    # events to notification-controller (9090).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# GitHub push webhooks reach the Receiver through the external gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-webhook-receiver
spec:
  endpointSelector:
    matchLabels:
      app: notification-controller
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# The Flux web UI, through the internal gateway only.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-web-ui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
