---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Web UI config for flux-operator (Web Config API). The operator watches this
# Secret and reloads on change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: flux-operator-web-config
    template:
      engineVersion: v2
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux-operator.${SECRET_DOMAIN}
            userActions:
              access: Impersonated
            authentication:
              type: OAuth2
              sessionDuration: 12h
              oauth2:
                provider: OIDC
                issuerURL: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/flux-operator/
                # Public identifier, not a secret. Matches the Authentik blueprint.
                clientID: 0WYWQsbDngJDKaKI0BwRdhIzPM2kz6SiwQZVueji
                clientSecret: "{{ .OIDC_CLIENT_SECRET }}"
                scopes: ["openid", "profile", "email", "offline_access"]
                # Prefix identity provider groups so no group name can match
                # a built-in Kubernetes group such as system:masters.
                impersonation:
                  username: "'authentik:' + claims.email"
                  groups: "has(claims.groups) ? claims.groups.map(g, 'authentik:' + g) : []"
  dataFrom:
    - extract:
        key: flux-operator
