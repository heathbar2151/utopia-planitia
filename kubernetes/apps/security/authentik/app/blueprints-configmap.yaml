      - model: authentik_core.application
        state: present
        identifiers:
          slug: unifi
        attrs:
          name: UniFi
          meta_launch_url: https://unifi.ui.com
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/unifi.svg
          policy_engine_mode: any
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, unifi]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
