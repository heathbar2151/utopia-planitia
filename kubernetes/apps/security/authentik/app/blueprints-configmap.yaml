---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/core/v1/configmap_v1.json
# Custom Authentik blueprints, mounted read-only into the worker container at
# /blueprints/custom (the community-standard custom-blueprint path - distinct
# from authentik's own reserved /blueprints/default, /blueprints/example,
# /blueprints/system subdirectories). Authentik watches this whole tree with
# a continuous filesystem watch (inotify) plus a 60-minute periodic re-apply,
# so any change here is picked up automatically without a pod restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-custom-blueprints
data:
  cac-default-authentication-mfa-threshold.yaml: |
    ---
    # Authentik's default-authentication-mfa-validation stage ships with
    # "Last validation threshold" (last_auth_threshold) at seconds=0, which
    # causes it to skip setting an "MFA already satisfied" cookie after a
    # successful validation - under some cookie-handling conditions this
    # lets the same MFA stage silently re-run within a single login,
    # prompting for TOTP twice with no error. See goauthentik/authentik#5972.
    #
    # Targets the existing built-in stage by its natural key (name), not a
    # hardcoded pk, so this applies correctly regardless of which authentik
    # version seeded it. `state: present` + only the one overridden attr
    # means authentik's own bundled seed blueprint still owns every other
    # field on this stage - this blueprint only pins the one field that
    # needed to move off its default.
    #
    # The binding runs in "all" mode so every bound policy must pass.
    version: 1
    metadata:
      name: cac-default-authentication-mfa-validation threshold override
    entries:
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          last_auth_threshold: seconds=30
          not_configured_action: configure
          # Only TOTP, passkeys/WebAuthn and recovery codes. Email codes are
          # weaker, and SMS and Duo aren't set up.
          device_classes: [static, totp, webauthn]
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, TOTP Setup]]
      - model: authentik_flows.flowstagebinding
        id: login-mfa-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
          order: 30
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          policy_engine_mode: all
      - model: authentik_policies_expression.expressionpolicy
        id: mfa-exempt-policy
        state: present
        identifiers:
          name: MFA exemption
        attrs:
          execution_logging: false
          expression: |
            flow_plan = request.context.get("flow_plan")
            user = flow_plan.context.get("pending_user") if flow_plan else None
            if user is None:
                return True
            return not user.all_groups().filter(name="${SECRET_AK_GROUP_MFA_EXEMPT}").exists()
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf login-mfa-binding
          policy: !KeyOf mfa-exempt-policy
        attrs:
          order: 20
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: absent
        identifiers:
          name: MFA
  cac-groups.yaml: |
    ---
    # Custom access-control groups (excludes authentik's own built-in
    # "authentik Admins"/"authentik Agent-Users"/"authentik Read-only" groups,
    # which authentik seeds itself). Group membership (which real users belong
    # to which group) is deliberately NOT set here - that's per-user data,
    # assigned through the Authentik admin UI after a user exists, not
    # something meaningful to "recreate from git."
    version: 1
    metadata:
      name: cac-custom access-control groups
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF3_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF4_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF4_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF5_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF5_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF3_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF1_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_SF2_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_ZULIP_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_ZULIP_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_DONETICK_USERS}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_DONETICK_ADMIN}
        attrs:
          is_superuser: false
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_FRIGATE_USERS}
        attrs:
          is_superuser: false
      # Exception to the rule above: this group's membership IS managed
      # here, so the list lives in git and anything added in the UI is
      # removed on the next apply.
      - model: authentik_core.group
        state: present
        identifiers:
          name: ${SECRET_AK_GROUP_MFA_EXEMPT}
        attrs:
          is_superuser: false
          users:
            - !Find [authentik_core.user, [username, ${SECRET_AK_USER_SF_DEV}]]
  cac-native-oidc-apps.yaml: |
    ---
    # Native OIDC apps. client_id is
    # kept literal (not secret - it's a public identifier, visible in every
    # browser auth-code request) so a from-scratch rebuild reproduces the same
    # value already configured in each app's 1Password OIDC_CLIENT_ID
    # field. client_secret is deliberately omitted - left untouched on
    # update; on a from-scratch create, generate fresh and copy into the
    # matching 1Password item's OIDC_CLIENT_SECRET field as a one-time step.

    version: 1
    metadata:
      name: cac-native OIDC applications
    entries:
      # --- gitea ---
      - model: authentik_providers_oauth2.oauth2provider
