          timeout: 30
  cac-password-policy.yaml: |
    ---
    # One password policy for the prompts where users choose a password
    # (invitation enrollment, recovery). Authentik's own
    # default-password-change prompt keeps its bundled policy: its default
    # blueprint sets that prompt's policy list and would revert a change.
    version: 1
    metadata:
      name: cac-password-policy
    entries:
      - model: authentik_policies_password.passwordpolicy
        id: password-policy
        state: present
        identifiers:
          name: cac-password-policy
        attrs:
          password_field: password
          check_static_rules: true
          length_min: 12
          amount_uppercase: 0
          amount_lowercase: 0
          amount_digits: 0
          amount_symbols: 0
          check_zxcvbn: true
          zxcvbn_score_threshold: 3
          # k-anonymity range query: only a hash prefix leaves the cluster.
          check_have_i_been_pwned: true
          hibp_allowed_count: 0
          error_message: Use at least 12 characters, not a common or previously breached password.
      - model: authentik_stages_prompt.promptstage
        state: present
        identifiers:
          name: default-enrollment-prompt-first
        attrs:
          validation_policies:
            - !KeyOf password-policy
      - model: authentik_stages_prompt.promptstage
        state: present
        identifiers:
          name: Change your password
        attrs:
          validation_policies:
            - !KeyOf password-policy
  cac-session-binding.yaml: |
    ---
    # Bind sessions to the continent they were created in. Authentik also
    # breaks the binding when either address has no GeoIP data (private
    # networks), so moving between the LAN and outside means signing in
    # to Authentik again; app sessions are unaffected.
    version: 1
    metadata:
      name: cac-session-binding
    entries:
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-authentication-login
        attrs:
          geoip_binding: bind_continent
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-recovery-user-login
        attrs:
          geoip_binding: bind_continent
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-enrollment-user-login
        attrs:
          geoip_binding: bind_continent
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-source-authentication-login
        attrs:
          geoip_binding: bind_continent
      - model: authentik_stages_user_login.userloginstage
        state: present
        identifiers:
          name: default-source-enrollment-login
        attrs:
          geoip_binding: bind_continent
  cac-notifications.yaml: |
    ---
    # Security notifications to the admin group, through Authentik's
    # existing email and in-app transports. Group events come only from
    # admin UI/API changes; blueprint applies don't emit them.
    version: 1
    metadata:
      name: cac-notifications
    entries:
      - model: authentik_events.notificationrule
        id: security-rule
        state: present
        identifiers:
          name: cac-notify-security-events
        attrs:
          severity: alert
          destination_group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
          transports:
            - !Find [authentik_events.notificationtransport, [name, default-email-transport]]
            - !Find [authentik_events.notificationtransport, [name, default-local-transport]]
          policy_engine_mode: any
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        id: suspicious-request
        state: present
        identifiers:
          name: cac-match-suspicious-request
        attrs:
          action: suspicious_request
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf security-rule
          policy: !KeyOf suspicious-request
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        id: impersonation
        state: present
        identifiers:
          name: cac-match-impersonation-started
        attrs:
          action: impersonation_started
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf security-rule
          policy: !KeyOf impersonation
        attrs:
          order: 1
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        id: group-created
        state: present
        identifiers:
          name: cac-match-group-created
        attrs:
          action: model_created
          model: authentik_core.group
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf security-rule
          policy: !KeyOf group-created
        attrs:
          order: 2
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        id: group-updated
        state: present
        identifiers:
          name: cac-match-group-updated
        attrs:
          action: model_updated
          model: authentik_core.group
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf security-rule
          policy: !KeyOf group-updated
        attrs:
          order: 3
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies_event_matcher.eventmatcherpolicy
        id: group-deleted
        state: present
        identifiers:
          name: cac-match-group-deleted
        attrs:
          action: model_deleted
          model: authentik_core.group
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf security-rule
          policy: !KeyOf group-deleted
        attrs:
          order: 4
          enabled: true
          negate: false
          timeout: 30
  cac-enrollment-flow.yaml: |
    ---
    version: 1
    metadata:
      name: cac-enrollment flow (invitation-only)
    entries:
      - model: authentik_stages_invitation.invitationstage
        id: invite-stage
        state: present
        identifiers:
          name: invite
        attrs:
          continue_flow_without_invitation: false
      - model: authentik_flows.flow
        id: enrollment-flow
        state: present
        identifiers:
          slug: default-enrollment-flow
        attrs:
          name: Email Enrollment with Email Verify
          title: You have be selected to join Section 31
          designation: enrollment
          authentication: require_unauthenticated
          layout: stacked
          policy_engine_mode: any
          denied_action: message_continue
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !KeyOf invite-stage
          order: 0
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !Find [authentik_stages_prompt.promptstage, [name, default-enrollment-prompt-first]]
          order: 10
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !Find [authentik_stages_prompt.promptstage, [name, default-enrollment-prompt-second]]
          order: 11
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_flows.flowstagebinding
        id: user-write-binding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !Find [authentik_stages_user_write.userwritestage, [name, default-enrollment-user-write]]
          order: 20
        attrs:
          # Policies here must run when the stage runs (after the invitation
          # has filled prompt_data), not when the flow is planned.
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !Find [authentik_stages_email.emailstage, [name, default-enrollment-email-verification]]
          order: 30
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf enrollment-flow
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-enrollment-user-login]]
          order: 100
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          invalid_response_action: retry
          policy_engine_mode: any
      - model: authentik_policies_expression.expressionpolicy
        id: invitation-groups-policy
        state: present
        identifiers:
          name: Invitation groups
        attrs:
          execution_logging: false
          expression: |
            from authentik.core.models import Group

            # Never grant these through an invitation.
            deny = {"${SECRET_AK_GROUP_ADMIN}", "${SECRET_AK_GROUP_MFA_EXEMPT}"}

            names = request.context.get("prompt_data", {}).get("groups_to_add") or []
            if isinstance(names, str):
                names = [names]
            groups = [
                g for g in Group.objects.filter(name__in=names)
                if not g.is_superuser and g.name not in deny
            ]
            skipped = sorted(set(names) - {g.name for g in groups})
            if skipped:
                ak_logger.warning("invitation groups skipped", skipped=skipped)
            plan = request.context["flow_plan"]
            plan.context["groups"] = list(plan.context.get("groups", [])) + groups
            return True
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf user-write-binding
          policy: !KeyOf invitation-groups-policy
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
  cac-login-hardening.yaml: |
    ---
    # Two additions to the default login and recovery flows:
    # - Recovery runs the same MFA validation as login before the new
    #   password is set. Without it, access to the mailbox alone gives a
    #   full session. The MFA exemption policy applies here too.
    # - A reputation policy denies both flows to a client IP whose score
    #   has reached the lower limit (repeated failed logins). Reputation
    #   policies pass when the score is at or below the threshold, so the
    #   binding is negated. It is bound to the flow, not a stage: a failed
    #   stage binding skips that stage instead of denying.
    # The flow targets use Find on policybindingmodel: a policy binding points
    # at the flow's policybindingmodel row, whose primary key differs from the
    # flow's, so a Find on the flow never matches the existing binding.
    version: 1
    metadata:
      name: cac-login hardening
    entries:
      - model: authentik_flows.flowstagebinding
        id: recovery-mfa-binding
        state: present
        identifiers:
          target: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
          stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
          order: 25
        attrs:
          evaluate_on_plan: false
          re_evaluate_policies: true
          policy_engine_mode: all
          invalid_response_action: retry
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf recovery-mfa-binding
          policy: !Find [authentik_policies_expression.expressionpolicy, [name, MFA exemption]]
        attrs:
          order: 20
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies_reputation.reputationpolicy
        id: reputation-policy
        state: present
        identifiers:
          name: Low reputation
        attrs:
          execution_logging: false
          check_ip: true
          check_username: false
          threshold: -5
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-authentication-flow]]
          policy: !KeyOf reputation-policy
        attrs:
          order: 0
          enabled: true
          negate: true
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-recovery-flow]]
          policy: !KeyOf reputation-policy
        attrs:
          order: 0
          enabled: true
          negate: true
          timeout: 30
      # The user settings flow lets a user change their own email. Apps
      # that match accounts by email would then let one user take over
      # another's account, so only admins may run it.
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_policies.policybindingmodel, [flow__slug, default-user-settings-flow]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
