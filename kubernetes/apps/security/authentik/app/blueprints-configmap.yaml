          client_id: b3CZTVoTgfqfassjYZ8YpAhISLW0vP2zGYbYMkXu
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          logout_method: backchannel
          logout_uri: https://${SECRET_HOST_GITEA}.${SECRET_DOMAIN}/auth/oidc/callback
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${SECRET_HOST_GITEA}.${SECRET_DOMAIN}/user/oauth2/Authentik/callback
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: ${SECRET_HOST_GITEA}
        attrs:
          name: gitea
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gitea.svg
          policy_engine_mode: any
          open_in_new_tab: false
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for gitea]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, ${SECRET_HOST_GITEA}]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

