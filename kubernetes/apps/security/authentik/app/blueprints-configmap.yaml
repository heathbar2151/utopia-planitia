          policy_engine_mode: any
          open_in_new_tab: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, home-assistant]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, home-assistant]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_USERS}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      # Actual was removed from the cluster; this deletes its tile (the
      # application's bindings go with it). Drop the entry once applied.
      - model: authentik_core.application
        state: absent
        identifiers:
          slug: actual
      - model: authentik_core.application
        state: present
        identifiers:
          slug: qbittorrent
        attrs:
          name: qBittorrent
          meta_launch_url: https://${SECRET_HOST_QBITTORRENT}.${SECRET_DOMAIN}
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/qbittorrent.svg
          policy_engine_mode: any
          open_in_new_tab: true
      - model: authentik_policies.policybinding
