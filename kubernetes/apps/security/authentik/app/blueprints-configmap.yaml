          open_in_new_tab: true
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Kavita (OIDC)]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, kavita]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, kavita]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_USERS}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      # --- Grafana --- native OIDC: Grafana's
      # generic_oauth is the relying party, so the redirect_uri is Grafana's
      # own callback. Grafana maps the `groups` claim from the profile scope
      # to GrafanaAdmin and rejects anyone else (role_attribute_strict).
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Grafana (OIDC)
        attrs:
          client_type: confidential
          # Must be explicit: a provider created by a blueprint gets an empty
          # grant_types list, and Authentik then rejects every authorize
          # request as "otherwise malformed" (the older providers were
          # backfilled with all types by a migration).
          grant_types:
            - authorization_code
            - refresh_token
          client_id: EZtrWJ3gdR0QhcJRgkB0C7c1usp6j9AiRnS7o4Qh
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://grafana.${SECRET_DOMAIN}/login/generic_oauth
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/grafana.svg
          policy_engine_mode: any
          open_in_new_tab: false
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Grafana (OIDC)]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, grafana]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      # --- Flux Operator web UI --- native OIDC. The UI acts as the user's
      # groups from the profile scope (prefixed authentik:), bound to the
      # read-only flux-web-user role in flux-system/flux-operator/web.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Flux Operator (OIDC)
        attrs:
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: 0WYWQsbDngJDKaKI0BwRdhIzPM2kz6SiwQZVueji
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://flux-operator.${SECRET_DOMAIN}/oauth2/callback
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: flux-operator
        attrs:
          name: Flux
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/flux-cd.svg
          policy_engine_mode: any
          open_in_new_tab: false
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Flux Operator (OIDC)]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, flux-operator]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      # --- Immich --- native OIDC. Immich's own
      # settings come from its config file (media/immich, IMMICH_CONFIG_FILE),
      # which carries this client_id and the client secret from the `immich`
      # 1Password item (OIDC_CLIENT_SECRET). The
      # `immich` scope emits immich_role so Authentik's admin group = Immich
      # admin (synced on every login). app.immich:///oauth-callback is the
      # mobile app's custom-scheme redirect.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: Immich role
        attrs:
          scope_name: immich
          description: Immich role (admin group is Immich admin)
          expression: |
            return {"immich_role": "admin" if ak_is_group_member(request.user, name="${SECRET_AK_GROUP_ADMIN}") else "user"}
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Immich
        attrs:
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: 80PGdiyQsdspDCCyiBaOHBcKJZWESHQasrco3KeR
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${SECRET_HOST_IMMICH}.${SECRET_DOMAIN}/auth/login
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${SECRET_HOST_IMMICH}.${SECRET_DOMAIN}/user-settings
            - matching_mode: strict
              redirect_uri_type: authorization
              url: app.immich:///oauth-callback
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, Immich role]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: immich
        attrs:
          name: Immich
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/immich.svg
          policy_engine_mode: any
          open_in_new_tab: false
          meta_launch_url: https://${SECRET_HOST_IMMICH}.${SECRET_DOMAIN}/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Immich]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, immich]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, immich]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_USERS}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30

      # --- Zulip --- native OIDC (Zulip's
      # GenericOpenIdConnectBackend, settings in self-hosted/zulip). Zulip
      # can't sync roles from OIDC (only SAML/LDAP), so group membership only
      # grants login; Zulip roles are set in Zulip itself.
      # Client secret generated by Authentik -> 1Password item `zulip`,
      # field OIDC_CLIENT_SECRET.
      #
      # Zulip refuses logins unless the IdP asserts email_verified, and
      # Authentik's default email mapping hardcodes it to False. So the
      # provider swaps the default email mapping for this one, on its own
      # `zulip` scope (Zulip requests it via SOCIAL_AUTH_OIDC_SCOPE). Its own
      # scope_name so the other providers' `!Find [scope_name, email]` stay
      # unambiguous. Asserting verified is safe only while users can't edit
      # their own email (tenant default_user_change_email is False; emails
      # are admin/invitation managed), otherwise a user could claim someone
      # else's address and take over their Zulip account.
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: Zulip email (verified)
        attrs:
          scope_name: zulip
          description: Email address for Zulip (admin-managed, asserted verified)
          expression: |
            return {"email": request.user.email, "email_verified": True}
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Zulip (OIDC)
        attrs:
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: apDyJs7tIJUOfPprSIB9HQ6UIxhY9iI427k4Zn1c
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${SECRET_HOST_ZULIP}.${SECRET_DOMAIN}/complete/oidc/
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, Zulip email (verified)]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: zulip
        attrs:
          name: Zulip
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/zulip.svg
          policy_engine_mode: any
          open_in_new_tab: false
          meta_launch_url: https://${SECRET_HOST_ZULIP}.${SECRET_DOMAIN}/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Zulip (OIDC)]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, zulip]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ZULIP_USERS}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, zulip]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_ZULIP_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      # Donetick: users are created on first login and matched by email.
      # Role comes from the `groups` claim (profile scope) on every login
      # (admin group -> circle admin, users group -> member). The second
      # redirect URI is the Android/iOS app's callback.
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Provider for Donetick
        attrs:
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          client_id: GnSnwCkvHeG5TsNtyy6n8FSn27QK8PfrxO0r8l8W
          issuer_mode: per_provider
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          access_code_validity: minutes=1
          access_token_validity: minutes=5
          refresh_token_validity: days=30
          refresh_token_threshold: hours=1
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}/auth/oauth2
            - matching_mode: strict
              redirect_uri_type: authorization
              url: donetick://auth/oauth2
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: donetick
        attrs:
          name: Donetick
          meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/donetick.svg
          policy_engine_mode: any
          open_in_new_tab: false
          meta_launch_url: https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}/
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Provider for Donetick]]
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, donetick]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_DONETICK_USERS}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !Find [authentik_core.application, [slug, donetick]]
          group: !Find [authentik_core.group, [name, ${SECRET_AK_GROUP_DONETICK_ADMIN}]]
        attrs:
          order: 0
          enabled: true
          negate: false
          timeout: 30
  cac-bookmark-apps.yaml: |
    ---
    # Dashboard tiles for apps that keep their own login. An application
    # with no provider is a bookmark: Authentik only shows the tile and
    # opens the launch URL. The bindings decide who sees it.
