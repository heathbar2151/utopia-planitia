---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-credentials
    template:
      engineVersion: v2
      # Runtime settings only. The Postgres superuser password is in
      # authentik-init-db, which only the init containers mount. No
      # AUTHENTIK_BOOTSTRAP_* values: the bootstrap blueprint would recreate
      # a non-expiring admin API token from them.
      data:
        AUTHENTIK_POSTGRESQL__HOST: postgres16-rw.database.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: authentik
        AUTHENTIK_POSTGRESQL__USER: "{{ .AUTHENTIK_POSTGRES_USER }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_POSTGRES_PASS }}"
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        # Outbound SMTP for password-reset/notification emails. Port 587 is STARTTLS,
        # so USE_TLS/USE_SSL are mutually exclusive per Authentik's own docs -
        # both set explicitly rather than relying on USE_SSL's already-false
        # default, so the intent reads clearly here.
        AUTHENTIK_EMAIL__HOST: smtp.protonmail.ch
        AUTHENTIK_EMAIL__PORT: "587"
        AUTHENTIK_EMAIL__USE_TLS: "true"
        AUTHENTIK_EMAIL__USE_SSL: "false"
        # Default timeout (10s) can be too tight for a slow STARTTLS handshake
        # + auth round-trip - a send that actually succeeds but takes longer
        # is misclassified as failed, and authentik's background-worker retry
        # then delivers a duplicate email. Raised so a slow-but-successful
        # send isn't retried.
        AUTHENTIK_EMAIL__TIMEOUT: "30"
        AUTHENTIK_EMAIL__USERNAME: "{{ .AUTHENTIK_EMAIL_USERNAME }}"
        AUTHENTIK_EMAIL__PASSWORD: "{{ .AUTHENTIK_EMAIL_PASSWORD }}"
        AUTHENTIK_EMAIL__FROM: "{{ .AUTHENTIK_EMAIL_FROM }}"
  dataFrom:
    - extract:
        key: authentik
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-init-db
    template:
      engineVersion: v2
      # For the postgres-init containers only: creates the database and role.
      data:
        INIT_POSTGRES_DBNAME: authentik
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .AUTHENTIK_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .AUTHENTIK_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: authentik
