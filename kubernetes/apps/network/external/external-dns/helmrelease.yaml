---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --events
      - --ignore-ingress-tls-spec
      - --ingress-class=external
      # No gateway-API equivalent of --ingress-class - without this,
      # gateway-httproute processes every HTTPRoute cluster-wide,
      # including ones parented only to envoy-internal (private IP),
      # which Cloudflare's API rejects outright for a proxied record
      # ("Target ... is not allowed for a proxied record"). Scopes this
      # instance to only envoy-external's routes, matching what
      # --ingress-class=external already does for the Ingress source.
      - --gateway-name=envoy-external
      # 1.23.0 (appVersion 0.23.0) defaults enable-legacy-annotation-prefix
      # to false, silently dropping support for external-dns.alpha.
      # kubernetes.io/* annotations with no error/log line, so an old-prefix
      # target annotation is ignored and the record falls back to the
      # private IP, which Cloudflare rejects. Re-enable both prefixes rather than
      # migrating every existing annotation across the cluster.
      - --enable-legacy-annotation-prefix
    policy: sync
    sources: ["crd", "gateway-httproute"]
    txtPrefix: k8s.
    txtOwnerId: default
    domainFilters: ["${SECRET_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: external-dns-secret
