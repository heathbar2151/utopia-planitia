---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      annotations:
        lbipam.cilium.io/ips: "${SECRET_LB_K8S_GATEWAY_IP}"
      externalTrafficPolicy: Cluster
    # Uses the actively-maintained k8s-gateway/k8s_gateway fork - the
    # original ori-edge/k8s_gateway project (chart 2.4.0) is abandoned and
    # never updated its GRPCRoute watch off the removed v1alpha2 API, so
    # enabling "HTTPRoute" there makes the plugin's internal resource-cache
    # sync fail permanently and SERVFAIL every query.
    watchedResources: ["HTTPRoute", "Service"]
