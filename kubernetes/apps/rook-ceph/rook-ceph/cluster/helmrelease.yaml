---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: 1.21.0
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 4
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: volsync
      namespace: volsync-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
      prometheusRuleOverrides:
        # node-exporter series carry a pod label, so a pod restart ends the
        # old series and starts new ones. Upstream's expression extrapolates
        # each series on its own, and the tail of an ended series can show a
        # false fill trend for two days. Merge the series across pods
        # (subquery) and only alert for filesystems still being reported.
        CephNodeDiskspaceWarning:
          expr: >-
            (
              predict_linear(
                (max without (pod, container, endpoint, service) (node_filesystem_free_bytes{device=~"/.*"}))[2d:5m],
                3600 * 24 * 5
              )
              * on (cluster, instance) group_left (nodename)
                max without (pod, container, endpoint, service) (node_uname_info)
              < 0
            )
            and on (instance, mountpoint) node_filesystem_free_bytes
    route:
      dashboard:
        annotations:
          gatus.home-operations.com/endpoint: |-
            # SecurityPolicy redirects every request to Authentik; check the
            # redirect itself rather than following it to the login page.
            conditions: ["[STATUS] == 302"]
            client:
              ignore-redirect: true
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
        parentRefs:
          - name: envoy-internal
            namespace: network
    toolbox:
      enabled: true
    configOverride: |
      [global]
      bdev_enable_discard = true
      bdev_async_discard = true
      osd_class_update_on_start = false
    cephClusterSpec:
      crashCollector:
        disable: false
      csi:
        readAffinity:
          enabled: false
        # network.connections.requireMsgr2 means mons only listen on v2 (:3300) -
        # CephFS kernel mounts need ms_mode or they speak msgr1 and fail with
        # "no mds is up".
        cephfs:
          kernelMountOptions: ms_mode=prefer-crc
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: insights
            enabled: true
          - name: pg_autoscaler
            enabled: true
          - name: rook
            enabled: true
      # The active mgr leaks ~150 MiB/day on Ceph 20.2.4, in steps at the
      # hourly volsync snapshot window. The chart's 1Gi limit OOMed it about
      # every 6 days; 2Gi stretches that while the leak is reported upstream.
      # Other daemons keep the chart defaults (Helm merges this map).
      resources:
        mgr:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            memory: 2Gi
      network:
        provider: host
        connections:
          requireMsgr2: true
      # CVE-2025-30156 (Ceph 20.2.4): rotate daemon and rbd-mirror-peer
      # CephX keys to the new aes256k type. Bumping keyGeneration rotates;
      # it can never be lowered. CSI keys must stay aes until every node runs
      # Linux 7.0+ (the kernel ceph client only speaks aes256k from there),
      # and rotating CSI keys flips every node's mounts at once.
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          rbdMirrorPeer:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            keyType: aes
      storage:
        useAllNodes: true
        useAllDevices: false
        deviceFilter: nvme0n1
        config:
          osdsPerDevice: "1"
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          mountOptions: ["discard"]
          parameters:
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores: []
