---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-secret
    template:
      engineVersion: v2
      data:
        # App
        FRIGATE_MQTT_USERNAME: "{{ .FRIGATE_MQTT_USERNAME }}"
        FRIGATE_MQTT_PASSWORD: "{{ .FRIGATE_MQTT_PASSWORD }}"
        # Cameras
        FRIGATE_CAM_1_USERNAME: "{{ .FRIGATE_CAM_1_USERNAME }}"
        FRIGATE_CAM_1_PASSWORD: "{{ .FRIGATE_CAM_1_PASSWORD }}"
        FRIGATE_CAM_2_USERNAME: "{{ .FRIGATE_CAM_2_USERNAME }}"
        FRIGATE_CAM_2_PASSWORD: "{{ .FRIGATE_CAM_2_PASSWORD }}"
        FRIGATE_CAM_3_USERNAME: "{{ .FRIGATE_CAM_3_USERNAME }}"
        FRIGATE_CAM_3_PASSWORD: "{{ .FRIGATE_CAM_3_PASSWORD }}"
        FRIGATE_CAM_4_USERNAME: "{{ .FRIGATE_CAM_4_USERNAME }}"
        FRIGATE_CAM_4_PASSWORD: "{{ .FRIGATE_CAM_4_PASSWORD }}"
        FRIGATE_CAM_5_USERNAME: "{{ .FRIGATE_CAM_5_USERNAME }}"
        FRIGATE_CAM_5_PASSWORD: "{{ .FRIGATE_CAM_5_PASSWORD }}"
        FRIGATE_CAM_7_USERNAME: "{{ .FRIGATE_CAM_7_USERNAME }}"
        FRIGATE_CAM_7_PASSWORD: "{{ .FRIGATE_CAM_7_PASSWORD }}"
        FRIGATE_CAM_8_USERNAME: "{{ .FRIGATE_CAM_8_USERNAME }}"
        FRIGATE_CAM_8_PASSWORD: "{{ .FRIGATE_CAM_8_PASSWORD }}"
  dataFrom:
    - extract:
        key: frigate
