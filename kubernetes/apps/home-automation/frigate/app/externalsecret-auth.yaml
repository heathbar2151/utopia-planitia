---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-oidc
    template:
      engineVersion: v2
      data:
        # Public identifier, not a secret. Matches the Authentik blueprint.
        client-id: 2nlKNvWIhEV1abz1UpGpZ4GfnjzQ5vbZo7AOr7i0
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: frigate
