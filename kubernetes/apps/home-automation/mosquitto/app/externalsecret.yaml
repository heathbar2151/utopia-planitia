---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mosquitto-secret
    template:
      engineVersion: v2
      data:
        # Frigate's user comes from its own item so the two can't drift.
        MQTT_FRIGATE_USERNAME: "{{ .FRIGATE_MQTT_USERNAME }}"
        MQTT_FRIGATE_PASSWORD: "{{ .FRIGATE_MQTT_PASSWORD }}"
        MQTT_HA_USERNAME: "{{ .MQTT_HA_USERNAME }}"
        MQTT_HA_PASSWORD: "{{ .MQTT_HA_PASSWORD }}"
        MQTT_KIOSK_USERNAME: "{{ .MQTT_KIOSK_USERNAME }}"
        MQTT_KIOSK_PASSWORD: "{{ .MQTT_KIOSK_PASSWORD }}"
        MQTT_EXPORTER_USERNAME: "{{ .MQTT_EXPORTER_USERNAME }}"
        MQTT_EXPORTER_PASSWORD: "{{ .MQTT_EXPORTER_PASSWORD }}"
  dataFrom:
    - extract:
        key: frigate
    - extract:
        key: mosquitto
