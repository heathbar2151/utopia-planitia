# Plain MQTT on 1883, password auth only.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd/passwd

# No PVC: clients republish their retained state on connect.
persistence false

log_dest stdout
# Notice level logs every TCP probe connection; keep errors and warnings.
log_type error
log_type warning
log_timestamp_format %Y-%m-%dT%H:%M:%S

# How often the $SYS topics the exporter reads are published.
sys_interval 10
