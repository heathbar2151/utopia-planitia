---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-pi
spec:
  hostnames: ["${SECRET_HOST_HOME_ASSISTANT_PI}.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: home-assistant-pi
          port: 80
