---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF4_NAME}-jwt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF4_NAME}-jwt
    template:
      engineVersion: v2
      data:
        # File-content keys (mounted as a volume by api/web's own
        # helmrelease.yaml) - own dedicated keypair from the
        # 1Password item, deliberately NOT
        # shared with any other instance's JWT keys, same reasoning as
        # staying-fit-1/staying-fit-2's own externalsecret-jwt.yaml.
        private.pem: "{{ .JWT_PRIVATE_KEY_PEM }}"
        public.pem: "{{ .JWT_PUBLIC_KEY_PEM }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF4_OP_ITEM}
