---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF2_NAME}-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF2_NAME}-db-credentials
    template:
      engineVersion: v2
      data:
        # A fully separate database on the same shared
        # cluster, with its own dedicated 1Password item (no credentials
        # shared with another instance). postgres-init creates the
        # database on first reconcile.
        DATABASE_URL: "postgres://{{ .STAYING_FIT_POSTGRES_USER }}:{{ .STAYING_FIT_POSTGRES_PASS }}@postgres16-rw.database.svc.cluster.local:5432/${SECRET_SF2_DB}"
  dataFrom:
    - extract:
        key: ${SECRET_SF2_OP_ITEM}
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF2_NAME}-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF2_NAME}-init-db-credentials
    template:
      engineVersion: v2
      # Only the postgres-init container mounts this: it holds the Postgres superuser password.
      data:
        INIT_POSTGRES_DBNAME: ${SECRET_SF2_DB}
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .STAYING_FIT_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .STAYING_FIT_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: ${SECRET_SF2_OP_ITEM}
