---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF2_NAME}-jwt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF2_NAME}-jwt
    template:
      engineVersion: v2
      data:
        # File-content keys (mounted as a volume by api/web's own
        # helmrelease.yaml), not env vars - own dedicated `staying-fit-2`
        # 1Password item/JWT keypair, same as externalsecret-db.yaml/
        # externalsecret-auth.yaml.
        private.pem: "{{ .JWT_PRIVATE_KEY_PEM }}"
        public.pem: "{{ .JWT_PUBLIC_KEY_PEM }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF2_OP_ITEM}
