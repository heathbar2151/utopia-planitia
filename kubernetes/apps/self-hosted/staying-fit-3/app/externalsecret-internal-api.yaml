---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Shared secret web sends to api on the pre-login account routes.
# Its own Secret so web and api can pick it up in
# separate steps: web first (sends the header), then api (enforces it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF3_NAME}-internal-api
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF3_NAME}-internal-api-credentials
    template:
      engineVersion: v2
      data:
        INTERNAL_API_SECRET: "{{ .INTERNAL_API_SECRET }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF3_OP_ITEM}
