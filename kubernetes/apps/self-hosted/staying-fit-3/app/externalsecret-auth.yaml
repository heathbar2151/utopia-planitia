---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF3_NAME}-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF3_NAME}-auth-credentials
    template:
      engineVersion: v2
      data:
        # Own dedicated 1Password item - not
        # shared with staying-fit-1/staying-fit-2's bootstrap admin/OIDC
        # credentials.
        BOOTSTRAP_ADMIN_USERNAME: "{{ .BOOTSTRAP_ADMIN_USERNAME }}"
        BOOTSTRAP_ADMIN_PASSWORD: "{{ .BOOTSTRAP_ADMIN_PASSWORD }}"
        OIDC_ISSUER_URL: "{{ .OIDC_ISSUER_URL }}"
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        # Optional per-instance Authentik/OIDC group -> admin role mapping
        # (app default is the literal group "admin" if this field doesn't
        # exist on the 1Password item at all - sprig's `default` here is
        # deliberate: a bare `{{ .OIDC_ADMIN_GROUP }}` on a missing key
        # renders as an empty string, not an absent env var, and the app's
        # own OIDC_ADMIN_GROUP fallback only fires on a truly unset var -
        # an empty string would silently lock every user out of admin).
        OIDC_ADMIN_GROUP: "{{ .OIDC_ADMIN_GROUP | default \"${SECRET_AK_GROUP_ADMIN}\" }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF3_OP_ITEM}
