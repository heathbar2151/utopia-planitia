---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Additions to the baseline component for this namespace. Kept here, not
# in each app's folder, so they apply in the same reconcile as the
# baseline and public traffic is never blocked in between.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: public-web
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/controller
        operator: In
        values:
          - ${SECRET_SF1_NAME}-web
          - ${SECRET_SF3_NAME}-web
          - ${SECRET_SF4_NAME}-web
          - ${SECRET_SF5_NAME}-web
  ingress:
    # The staying-fit instances with a public route.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# staying-fit integrations: the only staying-fit pods that call the
# internet, each to one upstream host. They opt out of the baseline, so
# these are their only rules. Every instance's api is in the ingress list.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: staying-fit-integrations-usda
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: staying-fit-integrations
      app.kubernetes.io/controller: usda
  ingress:
    # Kubelet probes.
    - fromEntities: ["host"]
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/controller
              operator: In
              values:
                - ${SECRET_SF1_NAME}-api
                - ${SECRET_SF2_NAME}-api
                - ${SECRET_SF3_NAME}-api
                - ${SECRET_SF4_NAME}-api
                - ${SECRET_SF5_NAME}-api
      toPorts:
        - ports:
            - port: "3010"
              protocol: TCP
  egress:
    # DNS through Cilium's proxy, so the toFQDNs rule below learns the
    # upstream's addresses.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.nal.usda.gov
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: staying-fit-integrations-off
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: staying-fit-integrations
      app.kubernetes.io/controller: "off"
  ingress:
    # Kubelet probes.
    - fromEntities: ["host"]
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/controller
              operator: In
              values:
                - ${SECRET_SF1_NAME}-api
                - ${SECRET_SF2_NAME}-api
                - ${SECRET_SF3_NAME}-api
                - ${SECRET_SF4_NAME}-api
                - ${SECRET_SF5_NAME}-api
      toPorts:
        - ports:
            - port: "3010"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: world.openfoodfacts.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# staying-fit catalog, one per environment: no internet, no route. It opts
# out of the baseline, so these are its only rules. Only that
# environment's apis call it; it talks to Postgres and the OTel collector.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: staying-fit-catalog-prod
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: staying-fit-catalog
      app.kubernetes.io/controller: prod
  ingress:
    # Kubelet probes.
    - fromEntities: ["host"]
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/controller
              operator: In
              values:
                - ${SECRET_SF1_NAME}-api
                - ${SECRET_SF3_NAME}-api
                - ${SECRET_SF4_NAME}-api
                - ${SECRET_SF5_NAME}-api
      toPorts:
        - ports:
            - port: "3020"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Postgres (the init-db container too); the database namespace's own
    # policy admits the catalog.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/instance: otel-collector
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: staying-fit-catalog-dev
spec:
