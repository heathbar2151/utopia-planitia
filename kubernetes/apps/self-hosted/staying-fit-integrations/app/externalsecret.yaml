---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Shared secret api sends in the x-integrations-secret header. Both
# integrations and every api that uses them read this one Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-integrations-caller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-integrations-caller
    template:
      engineVersion: v2
      data:
        INTEGRATIONS_CALLER_SECRET: "{{ .INTEGRATIONS_CALLER_SECRET }}"
  dataFrom:
    - extract:
        key: staying-fit-integrations
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# FoodData Central key. Only integrations-usda mounts it; api never sees it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-integrations-usda
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-integrations-usda
    template:
      engineVersion: v2
      data:
        USDA_API_KEY: "{{ .USDA_API_KEY }}"
  dataFrom:
    - extract:
        key: staying-fit-integrations
