---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: staying-fit-integrations
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: staying-fit-integrations
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # One integration per Deployment, so each gets its own egress rule
      # (networkpolicy.yaml in the namespace folder). Both exit 2 at
      # startup if their config is incomplete.
      usda:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: ghcr.io/bluetellarite/staying-fit-integrations
              tag: v0.70.0
            env:
              INTEGRATION: usda
              RUST_LOG: info
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
              OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=prod
            envFrom:
              - secretRef:
                  name: staying-fit-integrations-caller
              - secretRef:
                  name: staying-fit-integrations-usda
            probes: &probes
              # Neither probe needs the secret or calls the upstream.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3010
                  periodSeconds: 20
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3010
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources: &resources
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 128Mi
      "off":
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: *image
            env:
              INTEGRATION: "off"
              RUST_LOG: info
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
              OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=prod
            envFrom:
              - secretRef:
                  name: staying-fit-integrations-caller
            probes: *probes
            securityContext: *securityContext
            resources: *resources
    defaultPodOptions:
      imagePullSecrets:
        - name: staying-fit-ghcr-secret
      labels:
        # Fenced only by staying-fit-integrations-usda/-off (namespace
        # networkpolicy.yaml), not by the baseline's internet egress.
        network-policy/baseline: exclude
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
    service:
      usda:
        controller: usda
        primary: true
        ports:
          http:
            port: 3010
      "off":
        controller: "off"
        ports:
          http:
            port: 3010
