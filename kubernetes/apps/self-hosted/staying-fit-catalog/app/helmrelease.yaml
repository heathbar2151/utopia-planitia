---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: staying-fit-catalog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: staying-fit-catalog
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      # One catalog per environment, each with its own database. The catalog
      # runs its own migrations at startup and exits if CATALOG_DATABASE_URL
      # or CATALOG_CALLER_SECRET is missing. No ingress: only api calls it
      # (networkpolicy.yaml in the namespace folder).
      prod:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image: &initImage
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom:
              - secretRef:
                  name: staying-fit-catalog-prod-init-db
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: &image
              repository: ghcr.io/bluetellarite/staying-fit-catalog
              tag: v0.82.0
            env:
              RUST_LOG: info
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
              OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=prod
            envFrom:
              - secretRef:
                  name: staying-fit-catalog-prod-caller
              - secretRef:
                  name: staying-fit-catalog-prod-db
              - secretRef:
                  name: staying-fit-catalog-prod-operator
            probes: &probes
              # healthz checks nothing; readyz runs a SELECT 1 (2s timeout).
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3020
                  periodSeconds: 20
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 3020
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext: *securityContext
            resources: &resources
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 256Mi
      dev:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image: *initImage
            envFrom:
              - secretRef:
                  name: staying-fit-catalog-dev-init-db
            securityContext: *securityContext
        containers:
          app:
            image: *image
            env:
              RUST_LOG: info
              OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
              OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev
            envFrom:
              - secretRef:
                  name: staying-fit-catalog-dev-caller
              - secretRef:
                  name: staying-fit-catalog-dev-db
            probes: *probes
            securityContext: *securityContext
            resources: *resources
    defaultPodOptions:
      imagePullSecrets:
        - name: staying-fit-ghcr-secret
      labels:
        # Fenced only by staying-fit-catalog-prod/-dev (namespace
        # networkpolicy.yaml), not by the baseline's internet egress.
        network-policy/baseline: exclude
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
    service:
      prod:
        controller: prod
        primary: true
        ports:
          http:
            port: 3020
      dev:
        controller: dev
        ports:
          http:
            port: 3020
