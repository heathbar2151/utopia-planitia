---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Shared secret api sends in the x-catalog-secret header. The prod catalog
# and every prod/gym api read this one Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-prod-caller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-prod-caller
    template:
      engineVersion: v2
      data:
        CATALOG_CALLER_SECRET: "{{ .CATALOG_CALLER_SECRET }}"
  dataFrom:
    - extract:
        key: staying-fit-catalog
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Operator secret for the promotion queue (review, approve, decline, revert,
# rules). Only the prod catalog and the prod api, which hosts the operator
# panel, read it. It must differ from CATALOG_CALLER_SECRET, or the catalog
# refuses to start; empty leaves the operator routes off.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-prod-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-prod-operator
    template:
      engineVersion: v2
      data:
        CATALOG_OPERATOR_SECRET: "{{ .CATALOG_OPERATOR_SECRET }}"
  dataFrom:
    - extract:
        key: staying-fit-catalog
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-prod-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-prod-db
    template:
      engineVersion: v2
      data:
        CATALOG_DATABASE_URL: "postgres://{{ .CATALOG_POSTGRES_USER }}:{{ .CATALOG_POSTGRES_PASS }}@postgres16-rw.database.svc.cluster.local:5432/staying_fit_catalog"
  dataFrom:
    - extract:
        key: staying-fit-catalog
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-prod-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-prod-init-db
    template:
      engineVersion: v2
      # Only the init-db container mounts this: it holds the Postgres superuser password.
      data:
        INIT_POSTGRES_DBNAME: staying_fit_catalog
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .CATALOG_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .CATALOG_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: staying-fit-catalog
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Dev: same three Secrets from the staying-fit-catalog-dev item, so dev and
# prod never share a credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-dev-caller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-dev-caller
    template:
      engineVersion: v2
      data:
        CATALOG_CALLER_SECRET: "{{ .CATALOG_CALLER_SECRET }}"
  dataFrom:
    - extract:
        key: staying-fit-catalog-dev
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-dev-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-dev-db
    template:
      engineVersion: v2
      data:
        CATALOG_DATABASE_URL: "postgres://{{ .CATALOG_POSTGRES_USER }}:{{ .CATALOG_POSTGRES_PASS }}@postgres16-rw.database.svc.cluster.local:5432/staying_fit_catalog_dev"
  dataFrom:
    - extract:
        key: staying-fit-catalog-dev
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-catalog-dev-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-catalog-dev-init-db
    template:
      engineVersion: v2
      # Only the init-db container mounts this: it holds the Postgres superuser password.
      data:
        INIT_POSTGRES_DBNAME: staying_fit_catalog_dev
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .CATALOG_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .CATALOG_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: staying-fit-catalog-dev
