---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
# Replaces the image's /config/selfhosted.yaml. Secrets are left empty here
# and come from the donetick ExternalSecret as DT_* env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: donetick-config
data:
  selfhosted.yaml: |
    name: selfhosted
    is_done_tick_dot_com: false
    # Accounts come from Authentik only: no password signup, login or reset.
    is_user_creation_disabled: true
    disable_password_auth: true
    # One shared circle: the first OIDC login creates circle 1
    # and everyone after joins it, instead of each user getting their own.
    single_circle_instance: true
    telegram:
      token: ""
    pushover:
      token: ""
    database:
      # Donetick's Postgres DSN hardcodes sslmode=disable and the shared
      # clusters reject non-TLS connections, so SQLite on the volsync PVC
      # (path from DT_SQLITE_PATH).
      type: sqlite
      migration: true
    jwt:
      secret: ""
      session_time: 168h
      max_refresh: 1440h
    server:
      port: 2021
      read_timeout: 10s
      write_timeout: 10s
      rate_period: 60s
      rate_limit: 300
      cors_allow_origins:
        - "https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}"
        # Required by the Android/iOS apps.
        - "https://localhost"
        - "http://localhost"
        - "capacitor://localhost"
      serve_frontend: true
      serve_swagger: false
      public_host: "https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}"
    logging:
      level: info
      encoding: json
      development: false
    scheduler_jobs:
      due_job: 30m
      overdue_job: 3h
      pre_due_job: 3h
    storage:
      # Anything but "local" means S3.
      storage_type: local
      base_path: /data/uploads
    email:
      # No SMTP; password auth is off, so nothing needs to send mail.
      log_raw_url: false
    oauth2:
      name: Authentik
      client_id: GnSnwCkvHeG5TsNtyy6n8FSn27QK8PfrxO0r8l8W
      client_secret: ""
      # Off: the v0.1.80 web UI advertises PKCE but never sends the
      # verifier to the callback ("verifier is empty"). Confidential client
      # with a secret, so the code exchange is still authenticated.
      pkce: false
      scopes: [openid, profile, email]
      auth_url: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/authorize/
      token_url: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/token/
      user_info_url: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/userinfo/
      redirect_url: https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}/auth/oauth2
      # Synced from the `groups` claim (Authentik's profile scope) on every
      # login: members of admin_groups -> circle admin, anyone else -> member.
      admin_groups:
        - ${SECRET_AK_GROUP_DONETICK_ADMIN}
    realtime:
      enabled: true
      sse_enabled: true
      heartbeat_interval: 60s
      connection_timeout: 120s
      max_connections: 1000
      max_connections_per_user: 5
      event_queue_size: 2048
      cleanup_interval: 2m
      stale_threshold: 5m
      enable_compression: true
      enable_stats: true
      allowed_origins:
        - "https://${SECRET_HOST_DONETICK}.${SECRET_DOMAIN}"
