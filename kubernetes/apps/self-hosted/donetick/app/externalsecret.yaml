---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Donetick's secrets from 1Password item `donetick`. DT_* env vars override
# the matching keys in config/selfhosted.yaml (viper, "." -> "_").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: donetick
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: donetick
    template:
      engineVersion: v2
      data:
        # Signs sessions and local upload URLs; at least 32 characters
        # (Donetick refuses to start with a weak one). Rotating it logs
        # everyone out.
        DT_JWT_SECRET: "{{ .DONETICK_JWT_SECRET }}"
        # Generated by Authentik (Provider for Donetick).
        DT_OAUTH2_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: donetick
