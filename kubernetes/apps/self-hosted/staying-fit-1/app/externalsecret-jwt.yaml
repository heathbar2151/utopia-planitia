---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${SECRET_SF1_NAME}-jwt
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${SECRET_SF1_NAME}-jwt
    template:
      engineVersion: v2
      data:
        # File-content keys (mounted as a volume by api/web's own
        # helmrelease.yaml). Own dedicated keypair and 1Password item,
        # deliberately NOT shared with the other staying-fit instances - a
        # session minted by one instance must never verify against
        # another.
        private.pem: "{{ .PROD_JWT_PRIVATE_KEY_PEM }}"
        public.pem: "{{ .PROD_JWT_PUBLIC_KEY_PEM }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF1_OP_ITEM}
