---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: staying-fit-ghcr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: staying-fit-ghcr-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .GITHUB_USERNAME }}",
                "password": "{{ .PAT }}",
                "email": "{{ .GITHUB_EMAIL }}",
                "auth": "{{ printf "%s:%s" .GITHUB_USERNAME .PAT | b64enc }}"
              }
            }
          }
  dataFrom:
    - extract:
        key: staying-fit-ghcr
