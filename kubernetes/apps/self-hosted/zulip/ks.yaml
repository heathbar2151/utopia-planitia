---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zulip
  namespace: &namespace self-hosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: postgres-vector
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./kubernetes/apps/self-hosted/zulip/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
      # /data: uploads, generated zulip-secrets.conf, daily pg_dumps.
      VOLSYNC_CAPACITY: 10Gi
      # Mover runs as the image's zulip user (1000); the pod's fsGroup 1000
      # keeps root-written files group-readable for it.
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
