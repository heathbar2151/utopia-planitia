---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Zulip's own secrets from 1Password item `zulip`. The image maps SECRETS_*
# env vars into /etc/zulip/zulip-secrets.conf on every boot; anything not
# given here is generated once by the image and kept in /data.
# ZULIP_POSTGRES_PASS is shared with the zulip role in postgres-vector.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zulip
    template:
      engineVersion: v2
      data:
        SECRETS_postgres_password: "{{ .ZULIP_POSTGRES_PASS }}"
        # Django signing key - generate once, never rotate (rotating
        # invalidates every session and confirmation link).
        SECRETS_secret_key: "{{ .ZULIP_SECRET_KEY }}"
        # Generated by Authentik (Provider for Zulip (OIDC)); read in
        # settings via get_secret("social_auth_oidc_secret").
        SECRETS_social_auth_oidc_secret: "{{ .OIDC_CLIENT_SECRET }}"
        # Not a secret, just kept out of git: Zulip's admin/contact address.
        SETTING_ZULIP_ADMINISTRATOR: "{{ .ZULIP_ADMINISTRATOR }}"
  dataFrom:
    - extract:
        key: zulip
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# postgres-vector's CA certificate (public part only), so Zulip can verify
# the database server (REMOTE_POSTGRES_SSLMODE=verify-full).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-db-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: postgres-vector-ca
  target:
    name: zulip-db-ca
  data:
    - secretKey: ca.crt
      remoteRef:
        key: postgres-vector-ca-public
        property: ca.crt
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# RabbitMQ, memcached and Valkey are only reachable by Zulip and keep no
# state, so their passwords are generated in the cluster rather than kept in
# 1Password. Each ExternalSecret below gets its own value from this.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zulip-service
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-rabbitmq
spec:
  # Generate once; don't rotate on a schedule.
  refreshInterval: "0"
  target:
    name: zulip-rabbitmq
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        # Read by rabbitmq-server itself on first start (no persistence, so
        # every start is a first start).
        RABBITMQ_DEFAULT_USER: zulip
        RABBITMQ_DEFAULT_PASS: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zulip-service
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-valkey
spec:
  refreshInterval: "0"
  target:
    name: zulip-valkey
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        REDIS_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zulip-service
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Zulip always talks SASL to memcached (it generates a memcached_password, so
# its username becomes zulip@localhost). The stock memcached image supports
# SASL with a plain password file: memcached.conf enables PLAIN, sasl-pwdb
# holds user:password lines. Both the realm and bare forms are listed, since
# which one reaches the password check depends on Cyrus SASL realm handling.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zulip-memcached
spec:
  refreshInterval: "0"
  target:
    name: zulip-memcached
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
        memcached.conf: |
          mech_list: plain
        sasl-pwdb: |
          zulip@localhost:{{ .password }}
          zulip:{{ .password }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: zulip-service
