---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./backendtlspolicy.yaml
  - ./backendtrafficpolicy.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: plex-loki-rules
    files:
      - plex.yaml=./lokirule.yaml
    options:
      labels:
        loki_rule: "true"
  - name: plex-otelcol-config
    files:
      - otelcol.yaml=./otelcol.yaml
    options:
      labels:
        app: plex
        component: otelcol
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
