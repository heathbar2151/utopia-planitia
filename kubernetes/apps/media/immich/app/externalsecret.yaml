---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Immich's database password (1Password item `immich`, shared with the
# immich role in postgres-vector).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-db
    template:
      engineVersion: v2
      data:
        DB_PASSWORD: "{{ .IMMICH_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: immich
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Immich system config (IMMICH_CONFIG_FILE). Merged over Immich's defaults,
# so only changed settings are listed. With a config file Immich makes ALL
# system settings read-only in the admin UI - change them here instead.
# The client secret is generated by Authentik (Provider for Immich) and
# kept in the `immich` 1Password item as OIDC_CLIENT_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-config
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          server:
            externalDomain: https://${SECRET_HOST_IMMICH}.${SECRET_DOMAIN}
          oauth:
            enabled: true
            issuerUrl: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/immich/
            clientId: 80PGdiyQsdspDCCyiBaOHBcKJZWESHQasrco3KeR
            clientSecret: "{{ .OIDC_CLIENT_SECRET }}"
            # `immich` scope = Authentik's "Immich role" mapping (immich_role).
            scope: openid email profile immich
            roleClaim: immich_role
            buttonText: Login with Authentik
            autoRegister: true
            autoLaunch: false
          # The config file overrides immich-admin's enable-password-login,
          # so password login can only be changed here.
          passwordLogin:
            enabled: false
          # QuickSync hardware transcoding.
          ffmpeg:
            accel: qsv
            accelDecode: true
          # Immich's own DB dumps need superuser (pg_dumpall); CNPG/barman
          # backs up postgres-vector instead.
          backup:
            database:
              enabled: false
  dataFrom:
    - extract:
        key: immich
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# postgres-vector's CA certificate (public part only), so Immich can verify
# the database server (DB_SSL_MODE=verify-full).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: postgres-vector-ca
  target:
    name: immich-db-ca
  data:
    - secretKey: ca.crt
      remoteRef:
        key: postgres-vector-ca-public
        property: ca.crt
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Valkey is only reachable by Immich, so its password is generated in the
# cluster rather than kept in 1Password.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: immich-valkey
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-valkey
spec:
  # Generate once; don't rotate on a schedule.
  refreshInterval: "0"
  target:
    name: immich-valkey
    template:
      engineVersion: v2
      data:
        REDIS_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: immich-valkey
