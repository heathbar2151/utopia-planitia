---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: filebrowser-oidc
    template:
      engineVersion: v2
      data:
        # Public identifier, not a secret. Matches the Authentik blueprint.
        client-id: EwZeAbLDMbsjeEZb6KGYxntbQ019GbSWgWR3EICM
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: filebrowser
