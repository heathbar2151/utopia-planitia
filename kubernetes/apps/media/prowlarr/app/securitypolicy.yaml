---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: prowlarr-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prowlarr
  oidc:
    provider:
      issuer: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/prowlarr-oidc/
    clientIDRef:
      group: ""
      kind: Secret
      name: prowlarr-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: prowlarr-oidc
    redirectURL: https://prowlarr.${SECRET_DOMAIN}/oauth2/callback
    scopes: ["openid", "email", "profile"]
