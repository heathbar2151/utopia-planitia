---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the immich role (1Password item `immich`). The role name is
# fixed in cluster.yaml, so only the password comes from 1Password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-vector-immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-vector-immich
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: immich
        password: "{{ .IMMICH_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: immich
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the zulip role (1Password item `zulip`, shared with Zulip's
# own secret in self-hosted/zulip).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-vector-zulip
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-vector-zulip
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: zulip
        password: "{{ .ZULIP_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: zulip
