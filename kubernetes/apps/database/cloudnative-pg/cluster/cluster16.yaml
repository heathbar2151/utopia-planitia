---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3-10
  primaryUpdateStrategy: unsupervised
  # On rolling updates (operator upgrades, config changes) hand the primary
  # to an already-running replica instead of restarting it in place - a
  # switchover is a few seconds of write errors, a restart is much longer.
  primaryUpdateMethod: switchover
  storage:
    size: 20Gi
    storageClass: openebs-hostpath
  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "400"
      shared_buffers: 256MB
  # Non-owner app roles for the staying-fit instances. Each api connects as
  # its role (DATABASE_URL) and migrates as the database owner
  # (DATABASE_MIGRATION_URL), which grants the role its table rights on
  # every start, so row-level security holds. Passwords come from
  # externalsecret-staying-fit-app.yaml.
  managed:
    roles:
      # Prod staying-fit's database owner (created by its postgres-init
      # container). Managed only to give it CREATEDB, which database tenancy
      # mode needs to create space databases. No passwordSecret: CNPG then
      # leaves the password alone, and postgres-init keeps setting it. Every
      # attribute below matches the role as it was, since CNPG resets
      # omitted ones to their defaults.
      - name: ${SECRET_SF1_DB_OWNER}
        ensure: present
        login: true
        superuser: false
        createdb: true
        createrole: false
        replication: false
        bypassrls: false
        inherit: true
        connectionLimit: -1
      - name: ${SECRET_SF1_DB}_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: postgres16-${SECRET_SF1_NAME}-app
      - name: ${SECRET_SF2_DB}_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: postgres16-${SECRET_SF2_NAME}-app
      - name: ${SECRET_SF3_DB}_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: postgres16-${SECRET_SF3_NAME}-app
      - name: ${SECRET_SF4_DB}_app
        ensure: present
        login: true
        superuser: false
        bypassrls: false
        passwordSecret:
          name: postgres16-${SECRET_SF4_NAME}-app
  resources:
    requests:
      cpu: 100m
    limits:
      memory: 2Gi
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
      destinationPath: s3://cloudnative-pg/
      endpointURL: http://minio.self-hosted.svc.cluster.local:9000
      # Note: serverName version needs to be inclemented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres16-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: s3-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: s3-secret-access-key
#  # Note: previousCluster needs to be set to the name of the previous
#  # cluster when recovering from an existing cnpg cluster
#  bootstrap:
