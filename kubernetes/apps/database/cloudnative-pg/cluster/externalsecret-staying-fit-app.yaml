---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Passwords for the staying-fit app roles in cluster16.yaml, one per
# instance, from the field STAYING_FIT_APP_POSTGRES_PASS in that
# instance's 1Password item. The role name is fixed in cluster16.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres16-${SECRET_SF1_NAME}-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres16-${SECRET_SF1_NAME}-app
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: ${SECRET_SF1_DB}_app
        password: "{{ .STAYING_FIT_APP_POSTGRES_PASS }}"
  dataFrom:
    - extract:
        key: ${SECRET_SF1_OP_ITEM}
