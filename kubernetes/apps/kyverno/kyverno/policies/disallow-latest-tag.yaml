---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest tag
    policies.kyverno.io/description: >-
      Reports containers whose image has no tag, or the latest tag, and no digest.
spec:
  # Report only: results land in PolicyReports and Kyverno's metrics.
  validationActions: [Audit]
  failurePolicy: Ignore
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  # Check pods plus the controllers people edit. ReplicaSets are left out:
  # Deployments keep old ones scaled to zero for rollback, and checking
  # those only repeats stale results.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    # An untagged image parses as latest, so one check covers both.
    - expression: >-
        variables.containers.all(c,
          image(c.image).containsDigest() || image(c.image).tag() != 'latest')
      messageExpression: >-
        'image without a pinned tag or digest: ' +
        variables.containers.filter(c,
          !(image(c.image).containsDigest() || image(c.image).tag() != 'latest')).map(c, c.image).join(', ')
