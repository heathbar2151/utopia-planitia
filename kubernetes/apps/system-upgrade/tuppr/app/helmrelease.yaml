---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Two replicas with leader election: tuppr runs each node's upgrade Job
    # from another node, and a replica on the rebooting node fails over.
    replicaCount: 2
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
