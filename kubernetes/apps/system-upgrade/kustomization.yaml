---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade
components:
  - ../../components/common
resources:
  - ./tuppr/ks.yaml
patches:
  # Pod Security Standards: override the "baseline" default from
  # components/common. Every pod here already meets "restricted", so enforce it.
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: restricted
