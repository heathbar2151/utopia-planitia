---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitea-runner-credentials
    template:
      engineVersion: v2
      data:
        # In-cluster URL is fine here (unlike AUTHENTIK_HOST_BROWSER) - the
        # runner talks to Gitea entirely server-to-server, no browser
        # redirect involved.
        GITEA_INSTANCE_URL: http://gitea-server-app.devops.svc.cluster.local:3000
        # Starts empty, same as AUTHENTIK_OUTPOST_TOKEN - Gitea has to be up
        # first so an admin can generate a real registration token via
        # Site Administration -> Actions -> Runners -> Create new Runner,
        # then this gets pasted in and the ExternalSecret force-synced.
        GITEA_RUNNER_REGISTRATION_TOKEN: "{{ .GITEA_RUNNER_REGISTRATION_TOKEN }}"
  dataFrom:
    - extract:
        key: gitea
