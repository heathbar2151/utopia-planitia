---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitea-credentials
    template:
      engineVersion: v2
      # Credentials only. Plain config is env in server/helmrelease.yaml.
      data:
        GITEA__database__USER: "{{ .GITEA_POSTGRES_USER }}"
        GITEA__database__PASSWD: "{{ .GITEA_POSTGRES_PASS }}"
        # Signing and encryption keys: generate once and never rotate.
        # Rotating invalidates every existing session and token.
        GITEA__security__SECRET_KEY: "{{ .GITEA_SECRET_KEY }}"
        GITEA__security__INTERNAL_TOKEN: "{{ .GITEA_INTERNAL_TOKEN }}"
  dataFrom:
    - extract:
        key: gitea
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-init-db
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitea-init-db
    template:
      engineVersion: v2
      # Only the postgres-init container mounts this: it holds the Postgres superuser password.
      data:
        INIT_POSTGRES_USER: "{{ .GITEA_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .GITEA_POSTGRES_PASS }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: gitea
