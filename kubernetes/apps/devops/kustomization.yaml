---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops
components:
  - ../../components/common
  - ../../components/network-policy
resources:
  - ./networkpolicy.yaml
  - ./gitea/ks.yaml
patches:
  # Pod Security Standards: override the "baseline" default from
  # components/common. Runs workloads that need host access or extra privileges, so
  # "baseline" would block them. warn and audit still report at "restricted".
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/labels/pod-security.kubernetes.io~1enforce
        value: privileged
