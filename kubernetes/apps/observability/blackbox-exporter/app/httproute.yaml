---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blackbox-exporter
  annotations:
    gatus.home-operations.com/endpoint: |-
      # SecurityPolicy redirects every request to Authentik; check the
      # redirect itself rather than following it to the login page.
      conditions: ["[STATUS] == 302"]
      client:
        ignore-redirect: true
spec:
  hostnames: ["blackbox-exporter.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: blackbox-exporter
          port: 9115
