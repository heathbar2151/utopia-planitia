---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Client credentials for the status-oidc Authentik provider, consumed by
# the SecurityPolicy (Envoy Gateway is the OIDC relying party, not Gatus).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-oidc
    template:
      engineVersion: v2
      data:
        client-id: "{{ .OIDC_CLIENT_ID }}"
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: gatus
