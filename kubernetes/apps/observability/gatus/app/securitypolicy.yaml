---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: gatus-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: gatus
  oidc:
    provider:
      issuer: https://${SECRET_HOST_AUTHENTIK}.${SECRET_DOMAIN}/application/o/status-oidc/
    clientIDRef:
      group: ""
      kind: Secret
      name: gatus-oidc
    clientSecret:
      group: ""
      kind: Secret
      name: gatus-oidc
    redirectURL: https://${SECRET_HOST_GATUS}.${SECRET_DOMAIN}/oauth2/callback
    scopes: ["openid", "email", "profile"]
