---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Authentik OIDC client for Grafana's generic_oauth login. Fields live in the
# existing `grafana` 1Password item next to the admin credentials:
# OIDC_CLIENT_ID (matches client_id in the Authentik blueprint) and
# OIDC_CLIENT_SECRET (generated by Authentik, copied in once).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-oidc
    template:
      engineVersion: v2
      data:
        client-id: "{{ .OIDC_CLIENT_ID }}"
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: grafana
