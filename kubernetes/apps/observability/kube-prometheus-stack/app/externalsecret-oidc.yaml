---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prometheus-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prometheus-oidc
    template:
      engineVersion: v2
      data:
        # Public identifier, not a secret. Matches the Authentik blueprint.
        client-id: P8wlyP8NYmb34CbnYOAjBEDgD5g1mKnVA7hX5zxy
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: prometheus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-oidc
    template:
      engineVersion: v2
      data:
        # Public identifier, not a secret. Matches the Authentik blueprint.
        client-id: 0rxtVYByjsyyF8yTvizbIaZWM77YeHucY0P3J8Ui
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: alertmanager
