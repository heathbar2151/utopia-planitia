---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: miscellaneous-rules
spec:
  groups:
    - name: dockerhub
      rules:
        - alert: BootstrapRateLimitRisk
          annotations:
            summary: Kubernetes cluster at risk of being rate limited by dockerhub on bootstrap
          expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
          for: 15m
          labels:
            severity: critical
    - name: oom
      rules:
        - alert: OOMKilled
          annotations:
            summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
          expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
          labels:
            severity: critical
    - name: zfs
      rules:
        - alert: ZfsUnexpectedPoolState
          annotations:
            summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
          expr: node_zfs_zpool_state{state!="online"} > 0
          for: 15m
          labels:
            severity: critical
    - name: node-memory
      rules:
        # The stock rule uses MemAvailable, which leaves out the ZFS ARC. On
        # the NAS the ARC grows into most of RAM, so the stock rule fires
        # while the memory is still reclaimable. Count the ARC above its
        # minimum as available; nodes without ZFS fall back to MemAvailable.
        - alert: NodeMemoryHighUtilization
          annotations:
            summary: Host is running out of memory.
            description: Memory is filled up at {{ printf "%.2f" $value }}% on {{ $labels.instance }}.
          expr: |
            100 - (
              (
                (node_memory_MemAvailable_bytes{job="node-exporter"} + (node_zfs_arc_size{job="node-exporter"} - node_zfs_arc_c_min{job="node-exporter"}))
                or node_memory_MemAvailable_bytes{job="node-exporter"}
              )
              / node_memory_MemTotal_bytes{job="node-exporter"} * 100
            ) > 90
          for: 15m
          labels:
            severity: warning
