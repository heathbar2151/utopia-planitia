---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
# Flux controller metrics (reconcile counts/durations, gotk_*), which the
# provisioned Flux Grafana dashboards read. Only flux-operator had a monitor.
# Lives here rather than with the FluxInstance so it's applied after the
# Prometheus Operator CRDs on a rebuild.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom
