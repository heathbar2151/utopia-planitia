---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-agent
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.176.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Node agent: tails every container's log from /var/log/pods and ships it
    # to Loki over OTLP. Replaces Promtail (deprecated upstream). Logs only -
    # apps send traces/metrics/logs to the otel-collector gateway instead.
    fullnameOverride: otel-agent
    mode: daemonset
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
    presets:
      # filelog receiver on /var/log/pods with the container parser
      # (namespace/pod/container from the file path). storeCheckpoints keeps
      # file offsets in /var/lib/otelcol on the host, so a restart resumes
      # instead of skipping or re-sending. It runs the collector as root to
      # write that hostPath.
      logsCollection:
        enabled: true
        storeCheckpoints: true
      # Adds deployment/statefulset/daemonset names and service.name (from
      # app.kubernetes.io/name, like Promtail's `app` label). In daemonset
      # mode it only watches pods on its own node.
      kubernetesAttributes:
        enabled: true
    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null
        otlp: null
      exporters:
        # Loki 3 native OTLP ingest; the exporter appends /v1/logs. Loki
        # indexes service.name, k8s.namespace.name, k8s.pod.name,
        # k8s.container.name and the k8s workload names as labels
        # (service_name, k8s_namespace_name, ...).
        otlphttp/loki:
          endpoint: http://loki-headless.observability.svc.cluster.local:3100/otlp
          tls:
            insecure: true
      service:
        pipelines:
          traces: null
          metrics: null
          logs:
            receivers: [filelog]
            processors: [memory_limiter, k8sattributes, batch]
            exporters: [otlphttp/loki]
    # No receivers listen, so no ports (the daemonset defaults would also
    # claim hostPorts 4317/4318 on every node). Keep only self-metrics.
    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
      metrics:
        enabled: true
    podMonitor:
      enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
