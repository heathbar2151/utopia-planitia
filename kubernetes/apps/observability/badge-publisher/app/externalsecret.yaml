---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# From 1Password item `badge-publisher`: a fine-grained GitHub token with
# only the account-level "Gists: read and write" permission, and the ID of
# the secret gist the README badges read from.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: badge-publisher
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: badge-publisher
    template:
      engineVersion: v2
      data:
        GIST_TOKEN: "{{ .GIST_TOKEN }}"
        GIST_ID: "{{ .GIST_ID }}"
  dataFrom:
    - extract:
        key: badge-publisher
