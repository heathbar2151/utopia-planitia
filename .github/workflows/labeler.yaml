---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Labeler"

# pull_request_target runs this file from main with a write token, so it must
# never check out or run PR code. actions/labeler only reads the PR's changed
# file list through the API.
on:
  workflow_dispatch:
  pull_request_target:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
