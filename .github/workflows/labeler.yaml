---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Labeler"

# Runs on pull_request, not pull_request_target: GitHub blocks
# pull_request_target on public repos by default. Same-repo PRs get the job's
# write token; fork PRs get a read-only one and simply aren't labeled.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
