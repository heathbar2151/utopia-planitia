# Fake values for CI only. flate cannot decrypt cluster-secrets.sops.yaml,
# so the flate workflow supplies this Secret (once per namespace) to fill
# postBuild substitution. Values only need the right shape: documentation
# IP ranges, example.com, DNS-safe names. Keys must match
# kubernetes/components/common/cluster-secrets.sops.yaml; the workflow
# fails if they drift.
