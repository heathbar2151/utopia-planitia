---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  timeout: 600
  force: true
  wait: true
  waitForJobs: true

repositories:
  - name: cilium
    url: https://helm.cilium.io

  - name: jetstack
    url: https://charts.jetstack.io

  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

releases:
  # Installed first: cilium's values create a ServiceMonitor, so the
  # monitoring.coreos.com CRDs must exist before Flux does. Same release
  # name/namespace/version as Flux's observability/prometheus-operator-crds
  # HelmRelease, which adopts it after bootstrap.
  - name: prometheus-operator-crds
    namespace: observability
    chart: prometheus-community/prometheus-operator-crds
    version: 32.0.1

  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.3
    values:
      - '{{ requiredEnv "ROOT_DIR" }}/kubernetes/apps/kube-system/cilium/app/helm-values.yaml'
      - '{{ requiredEnv "ROOT_DIR" }}/bootstrap/cilium-overrides.yaml.gotmpl'
    needs: ['observability/prometheus-operator-crds']

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.49.0
    values:
      - '{{ requiredEnv "ROOT_DIR" }}/kubernetes/apps/kube-system/coredns/app/helm-values.yaml'
      - '{{ requiredEnv "ROOT_DIR" }}/bootstrap/coredns-overrides.yaml.gotmpl'
    needs: ['kube-system/cilium']

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.21.2
    values: ['{{ requiredEnv "ROOT_DIR" }}/kubernetes/apps/cert-manager/cert-manager/app/helm-values.yaml']
    needs: ['kube-system/coredns']

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.61.0
    values: ['{{ requiredEnv "ROOT_DIR" }}/kubernetes/apps/flux-system/flux-operator/app/helm-values.yaml']
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.61.0
    wait: false
    values: ['{{ requiredEnv "ROOT_DIR" }}/kubernetes/apps/flux-system/flux-operator/instance/helm-values.yaml']
    needs: ['flux-system/flux-operator']
